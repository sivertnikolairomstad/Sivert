<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--CUT-->
<meta name="claude:viewport-fit-sides" content="cover">
<title>BDS110 Omdømmeredderen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: hotellresepsjon. Smal toppbar med rang/XP, én sentrert arbeidskolonne (max 920px),
   moduler som romnøkler med messingbrikke, omdømme vist som gjestescore. */
:root{
  --bg:#ecf1f0; --surface:#ffffff; --surface2:#f5f8f7; --ink:#11282a; --muted:#566b6c; --line:#cddad7;
  --primary:#0f5257; --on-primary:#ffffff; --brass:#a87722; --brass-soft:#f3e7cd; --on-brass:#3d2a05;
  --good:#1c7a4b; --good-soft:#dff3e7; --bad:#b3382c; --bad-soft:#fbe4e0;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b1a1c; --surface:#122527; --surface2:#172e30; --ink:#e7f0ee; --muted:#93aaa8; --line:#27413f;
  --primary:#5cc4bd; --on-primary:#06201f; --brass:#e0b458; --brass-soft:#3a2f14; --on-brass:#f6e3b4;
  --good:#63d198; --good-soft:#143524; --bad:#f28474; --bad-soft:#41201b; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0b1a1c; --surface:#122527; --surface2:#172e30; --ink:#e7f0ee; --muted:#93aaa8; --line:#27413f;
  --primary:#5cc4bd; --on-primary:#06201f; --brass:#e0b458; --brass-soft:#3a2f14; --on-brass:#f6e3b4;
  --good:#63d198; --good-soft:#143524; --bad:#f28474; --bad-soft:#41201b; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em;overflow-wrap:anywhere;hyphens:auto}
h1{font-size:clamp(1.9rem,5vw,2.9rem);font-weight:800}
h2{font-size:clamp(1.35rem,3.4vw,1.75rem);font-weight:700}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in,.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.05rem;background:none;border:0;padding:4px 0;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:50%;background:var(--brass);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;left:8px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--surface)}
.rank{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0;font-size:.86rem}
.rank b{white-space:nowrap}
.xpbar{width:110px;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.xpbar span{display:block;height:100%;background:var(--brass);transition:width .4s}
.xpnum{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.wrap{padding-block:28px 64px;display:flex;flex-direction:column;gap:24px}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--brass)}
.lead{color:var(--muted);max-width:62ch}
.hero{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mode{text-align:left;transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-2px);border-color:var(--primary)}
.mode .go{margin-top:auto;font-weight:700;color:var(--primary)}
.mode small,.small{color:var(--muted);font-size:.88rem}
.btn{background:var(--primary);color:var(--on-primary);border:0;border-radius:10px;padding:11px 18px;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
.btn.sm{padding:7px 12px;font-size:.88rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.back{background:none;border:0;color:var(--muted);font-weight:600;padding:4px 0;align-self:flex-start}
.back:hover{color:var(--ink)}
.stats{display:flex;gap:24px;flex-wrap:wrap}
.stat b{font-family:var(--display);font-size:1.5rem;display:block;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem}
/* romnøkler */
.key{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;padding:16px}
.tag{width:54px;height:70px;border-radius:27px 27px 10px 10px;background:var(--brass-soft);border:2px solid var(--brass);color:var(--on-brass);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:9px;font-family:var(--display);font-weight:800;font-size:1.02rem;position:relative}
.tag::before{content:"";position:absolute;top:9px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--brass)}
.key-body{display:flex;flex-direction:column;gap:6px;min-width:0}
.stars{color:var(--brass);letter-spacing:2px;font-size:1rem}
.stars .off{color:var(--line)}
/* quiz */
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--primary);transition:width .3s}
.qmeta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.86rem;flex-wrap:wrap}
.quote{border-left:4px solid var(--brass);padding:8px 14px;background:var(--surface2);border-radius:0 10px 10px 0}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;display:flex;gap:12px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--primary)}
.opt kbd{font:700 .8rem var(--body);border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted);flex:none}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;color:inherit}
.fb{border-radius:12px;padding:14px 16px;background:var(--surface2);border:1px solid var(--line)}
.fb.ok{border-color:var(--good)} .fb.no{border-color:var(--bad)}
.fb b.ok{color:var(--good)} .fb b.no{color:var(--bad)}
.flash{min-height:210px;justify-content:center;align-items:center;text-align:center;gap:14px}
.flash h2{font-size:clamp(1.4rem,4vw,2rem)}
/* case */
.meter{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.score{font-family:var(--display);font-weight:800;font-size:1.7rem;font-variant-numeric:tabular-nums;background:var(--primary);color:var(--on-primary);border-radius:12px 12px 12px 2px;padding:2px 12px}
.mbar{flex:1;min-width:140px;height:12px;background:var(--line);border-radius:12px;overflow:hidden}
.mbar span{display:block;height:100%;transition:width .5s,background .5s}
.delta{font-weight:700;font-variant-numeric:tabular-nums}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.scene{font-size:1.04rem;max-width:68ch}
.pill{display:inline-block;align-self:flex-start;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--brass-soft);color:var(--on-brass)}
/* boss */
.bosshp{display:flex;flex-direction:column;gap:6px}
.hpbar{height:16px;border-radius:8px;background:var(--line);overflow:hidden}
.hpbar span{display:block;height:100%;background:var(--bad);transition:width .4s}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600}
.tab[aria-selected="true"]{border-color:var(--primary);background:var(--primary);color:var(--on-primary)}
textarea{width:100%;min-height:340px;font:inherit;line-height:1.6;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px;resize:vertical}
.pick{text-align:left;position:relative}
.pick[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary)}
.task ul,.model ul,.model ol{margin:6px 0 0;padding-left:20px}
.task li,.model li{margin:3px 0}
.grade{font-family:var(--display);font-weight:800;font-size:3.2rem;line-height:1;color:var(--primary)}
.check{list-style:none;padding:0;margin:0;display:grid;gap:5px}
.check li{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:.93rem}
.check .y{color:var(--good);font-weight:800} .check .n{color:var(--bad);font-weight:800}
details{border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:var(--surface2)}
summary{font-weight:700;cursor:pointer}
.opt.sel{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary)}
.opt.gone{visibility:hidden}
.husk{margin:0;padding-left:20px;display:grid;gap:6px}
.lcard{border-left:4px solid var(--brass);padding:10px 14px;background:var(--surface2);border-radius:0 10px 10px 0}
.lcard b{font-family:var(--display);font-size:1.05rem;display:block}
.mboard{display:grid;grid-template-columns:1fr 1.7fr;gap:14px;align-items:start}
.mcol{display:grid;gap:10px}
.mcol .opt{min-height:64px;align-items:center}
.mterms .opt{font-weight:700;justify-content:center;text-align:center}
.item{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,6vw,2.6rem);text-align:center;padding:18px 0}
.lives{color:var(--bad);letter-spacing:4px;font-size:1.25rem}
.big{font-family:var(--display);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums}
@media (max-width:640px){.mboard{grid-template-columns:1fr}.mterms{grid-template-columns:1fr 1fr}}
.book h4{font-family:var(--display);font-size:1rem;margin:14px 0 4px}
.book h4:first-child{margin-top:0}
.book p{margin:6px 0;max-width:72ch}
.book ul{margin:6px 0;padding-left:20px;max-width:72ch}
.book li{margin:4px 0}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;font-size:.92rem;min-width:100%}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--surface2);font-weight:700}
input[type=search]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px}
details.mod{background:var(--surface)}
details.mod>summary{font-family:var(--display);font-size:1.1rem}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.note{font-size:.86rem;color:var(--muted);border-left:3px solid var(--line);padding-left:12px;max-width:70ch}
@media (max-width:520px){.xpbar{width:64px}.rank b{max-width:42vw;overflow:hidden;text-overflow:ellipsis}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <button class="brand" data-act="home" id="brand"><i></i>Omdømmeredderen</button>
  <div class="rank" id="rank"></div>
</div></header>
<main class="wrap" id="app" lang="nb"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ====================== KUNNSKAPSBASE (fra kompendiet) ====================== */
// qs: [spørsmål, RIKTIG, feil, feil, feil, forklaring]   terms: [begrep, definisjon]
const M=[
{id:'m0',nr:'100',name:'Eksamensteknikk og sensorkrav',pensum:'Del 1 og 2 i kompendiet',
 terms:[
  ['HVA-delen av emnet','Sentrale begreper og teoretisk rammeverk: organisasjonskommunikasjon i digital kontekst, kanaler, plattformer, KI og kommunikasjonsmodeller'],
  ['HVEM-delen av emnet','Interessentene: interne, eksterne, primære og sekundære, sett i lys av relasjoner, kanalvalg, makt og kundeopplevelse'],
  ['HVORDAN-delen av emnet','Strategi og praksis: kommunikasjonsstrategi, endrings- og krisekommunikasjon, identitet og omdømme, retorikk og etikk'],
  ['Synsing','Påstander og anbefalinger som ikke er faglig begrunnet i teori eller knyttet til relevante eksempler']],
 qs:[
  ['Hvordan er oppgavesettet på eksamen bygget opp?','6 spørsmål, du besvarer 3, og hver teller 1/3','6 spørsmål, alle skal besvares','4 spørsmål, du besvarer 2','3 spørsmål, der det beste svaret teller dobbelt','Eksamen har 6 spørsmål. Du velger 3, og de teller likt.'],
  ['Hvor mye tid anbefaler foreleser per oppgave?','Ca. 65 minutter, pluss tid til planlegging og gjennomlesing','Ca. 30 minutter','Ca. 90 minutter','Så lenge du trenger på den første, resten deles likt','4 timer på 3 oppgaver gir ca. 65 min per oppgave og litt tid til plan og gjennomlesing.'],
  ['Hvilke hjelpemidler er tillatt?','Ingen','Pensumbøkene','Egne notater','KI-verktøy uten nett','Skriftlig digital skoleeksamen uten hjelpemidler.'],
  ['Hva kjennetegner en A-besvarelse i BDS110?','Perspektiver, teorier og begreper presenteres, drøftes og eksemplifiseres presist, faglig sikkert og reflektert','Flest mulig modeller nevnes ved navn','Besvarelsen er lengst mulig','Pensum gjengis ordrett uten egne vurderinger','A krever høyt kunnskapsnivå og at teoriene både presenteres, drøftes og eksemplifiseres på en presis og reflektert måte.'],
  ['Hvordan bygger du et sterkt drøftingspoeng etter sensorveiledningen?','Situasjon og fase, så teoretisk begrunnet valg, så vurdering av betingelser, alternativer og risikoer','Definisjon, så sitat, så konklusjon','Egen mening, så et eksempel, så teori','Modellnavn, så årstall, så forfatter','Oppskriften er: 1) situasjon og fase, 2) teoretisk begrunnet valg, 3) vurdering/nyansering.'],
  ['Hva bør du gjøre kort i innledningen?','Forklare hvorfor du har valgt å løse oppgaven slik, og skissere strukturen','Oppsummere konklusjonen i detalj','Liste opp hele pensumlisten','Gjengi oppgaveteksten ordrett','Foreleser ber deg redegjøre for metode/valg og gi besvarelsen en logisk oppbygning.'],
  ['Hva vektlegges IKKE i evalueringen?','Å gjengi flest mulig årstall og sidetall','God struktur og oversiktlig fremstilling','Integrering av stoff fra ulike deler av pensum','Selvstendig refleksjon','Struktur, relevante teorier, integrering og selvstendig refleksjon vektlegges. Unngå synsing.'],
  ['Hva er en sterk besvarelse ifølge sensorveiledningen?','En som viser sammenhenger mellom kontekst/fase, interessentenes reaksjoner, strategivalg og kanalvalg','En som behandler hver modell isolert','En som unngår eksempler for å holde seg teoretisk','En som bare beskriver caset','Sammenhengene mellom fase, interessenter, strategi og kanal er kjernen.']]},
{id:'m1',nr:'101',name:'Introduksjon til digital kommunikasjon',pensum:'Zhong kap. 1–3; Arnulf kap. 4; Van Gils kap. 15',
 terms:[
  ['Organisasjonskommunikasjon','En rekke prosesser der organisasjoner skaper, forhandler og håndterer mening (Cheney & Christensen, 2001)'],
  ['Digitisering','Å konvertere analog informasjon til digitalt format, for eksempel papirskjemaer til filer'],
  ['Digitalisering','Bruk av digital teknologi for å endre og effektivisere arbeidsprosesser og samhandling'],
  ['Digital transformasjon','Dyptgripende organisatorisk og strategisk omstilling der teknologi endrer hele forretningsmodellen, kulturen og verdiskapingen'],
  ['Teknologiakseptansemodellen (TAM)','Forklarer om ansatte og kunder tar i bruk ny teknologi ut fra opplevd nytte og opplevd brukervennlighet'],
  ['Synkron CMC','Datamediert kommunikasjon i sanntid, for eksempel videomøter og live chat'],
  ['Asynkron CMC','Tidsforskjøvet datamediert kommunikasjon, for eksempel e-post, intranett og diskusjonsfora'],
  ['Symmetrisk kommunikasjon','Likeverdig dialog mellom organisasjonen og omverdenen'],
  ['Asymmetrisk kommunikasjon','Kommunikasjon der organisasjonen forsøker å påvirke eller overtale omverdenen'],
  ['«Kommunikasjon er organisasjonen»','Synet der organisasjonen blir til og formes gjennom kommunikasjon, som er selve byggesteinen'],
  ['«Kommunikasjon i organisasjonen»','Synet der organisasjonen er en beholder eller struktur som informasjon flyter i']],
 qs:[
  ['Et hotell skanner gamle papirskjemaer for gjesteregistrering til PDF. Hva er dette?','Digitisering','Digitalisering','Digital transformasjon','Datamediert kommunikasjon','Digitisering er å gjøre analog informasjon digital. Arbeidsprosessen endres først ved digitalisering.'],
  ['Resepsjonistene ser nytten av det nye bookingsystemet, men bruker det ikke fordi det er tungvint. Hvilken TAM-faktor svikter?','Opplevd brukervennlighet','Opplevd nytte','Sosial tilstedeværelse','Medierikhet','TAM har to faktorer: opplevd nytte og opplevd brukervennlighet. Her er nytten på plass, men ikke brukervennligheten.'],
  ['På hvilke tre nivåer påvirker digitalisering organisasjoner?','Makro, meso og mikro','Strategisk, taktisk og operativt','Internt, eksternt og globalt','Etos, patos og logos','Modul 1 spør hvordan digitalisering virker på makro-, meso- og mikronivå.'],
  ['Hva er poenget med at digital teknologi kan være en «kommunikativ aktør»?','KI som chatboter kommuniserer selv, noe som reiser spørsmål om ansvar, tillit og menneskelig skjønn','Teknologi er alltid nøytral','Kanaler og aktører er det samme','At ansatte ikke lenger trenger digital kompetanse','Teknologi kan være både kanal og aktør. KI gir effektivisering og personalisering, men krever menneskelig skjønn.'],
  ['Hva ligger i at kommunikasjon er «mer enn informasjon»?','Det handler om meningsskaping, relasjon og organisering, ikke bare enveis overføring','At man alltid bør sende mer informasjon','At digitale kanaler er bedre enn fysiske','At informasjon bør være konfidensiell','Overføringsperspektivet står mot delingsperspektivet.'],
  ['Hvilket er et eksempel på nye arbeidsformer i nettverkssamfunnet?','Distribuerte team og gig-arbeid','Linjeorganisering','Samlebånd','Faste kontortider for alle','Fjernsamarbeid, distribuerte team, gig-arbeid og digitale nomader nevnes i modulen.']]},
{id:'m2',nr:'102',name:'Virksomhetskommunikasjon',pensum:'Cornelissen kap. 1–3; Zhong kap. 9',
 terms:[
  ['Broadcasting','Interessenter mottar budskap fra organisasjonen på en kontrollert og planlagt måte, en-til-mange'],
  ['Crowd-casting','Interessenter er aktive deltakere som produserer eller videresender innhold om organisasjonen, mange-til-mange'],
  ['POEM','Samspillet mellom eide, betalte og fortjente medier'],
  ['Stakeholder engagement','Dagens fase i virksomhetskommunikasjon, der kommunikasjon er et strategisk verktøy preget av advocacy, interaktivitet, transparens og autentisitet'],
  ['Positioning','Den dominerende tilnærmingen til virksomhetskommunikasjon på 1980–2000-tallet'],
  ['Corporate positioning','Planlagt og kontrollert overføring av virksomhetens budskap og kampanjer, prinsippet bak tradisjonelle medieomgivelser'],
  ['Content generation','Spontan og fri generering og spredning av innhold om virksomheten, prinsippet bak nye medieomgivelser'],
  ['Advocacy (talsmannskap)','At interessenter blir talsmenn for virksomheten fordi det er sammenheng mellom det den sier og gjør']],
 qs:[
  ['Hvilke tre kommunikasjonsområder samordnes i van Riels modell?','Ledelses-, organisasjons- og markedskommunikasjon','Intern, ekstern og digital kommunikasjon','Informasjon, overtalelse og dialog','Atferd, kommunikasjon og symbolisme','Misjon/visjon, strategi, identitet og image er felles utgangspunkt for de tre områdene.'],
  ['Hvilke fire nøkkelbegreper kjennetegner stakeholder engagement?','Advocacy, interactivity, transparency og authenticity','Power, legitimacy, urgency og salience','Participatory, authentic, resourceful og credible','Publicity, promotion, positioning og planning','Cornelissen (2023, s. 14).'],

{id:'c3',tema:'Krisekommunikasjon',title:'Norovirus på Fjordgløtt',
 intro:'Lørdag kl. 07.40: fjorten gjester er syke etter gårsdagens buffet. Én har allerede skrevet om det på Facebook, og en konferanse med 200 deltakere sjekker inn i ettermiddag.',

 steps:[
 {t:'Hva gjør du den første timen?',o:[
  ['Går raskt ut med det dere vet, hva gjestene skal gjøre og når neste oppdatering kommer, og varsler kommuneoverlegen og Mattilsynet',10,'Under krisen gjelder rask handling, empati og fakta. Du håndterer informasjonsbehovet og bruker sosiale medier til raske oppdateringer.'],

 {t:'Teknisk sjef finner at kjølerommet sviktet i natt. Hvilken krisetype er dette?',o:[
  ['Uhell: intern og utilsiktet',8,'Teknisk svikt er uhell. Organisasjonen har likevel ansvar, og det styrer responsstrategien.'],
  ['Overtredelse: intern og tilsiktet',-2,'Det ville vært riktig hvis noen bevisst hadde ignorert alarmen. Ingenting tyder på det ennå.'],
  ['Faux pas: ekstern og utilsiktet',-3,'Faux pas er uheldige uttalelser eller feiltrinn som vekker reaksjoner utenfra.'],
  ['Aggresjon: ekstern og tilsiktet',-5,'Aggresjon er sabotasje eller angrep utenfra. Da ville hotellet vært offer.']]},
 {t:'Telefonen ringer konstant. Hvem prioriterer du først?',o:[
  ['De syke gjestene og helsemyndighetene',10,'De har makt, legitimitet og hast: definitive stakeholders med høyeste prioritet.'],

  ['Reisebloggerne som krever kommentar',-5,'Demanding: hast uten makt eller legitimitet. De får svar, men styrer ikke rekkefølgen.']]},
 {t:'Prøvene bekrefter at smitten kom fra hotellets kjøkken. Hvilken responsstrategi?',o:[
  ['Aksept: ta ansvar, be uforbeholdent om unnskyldning, refundere og dekke utgifter',12,'Når ansvaret ligger hos hotellet, er rebuild/apology strategien som beskytter omdømmet best.'],

 {t:'En journalist ringer med vinklingen «Sparte hotellet på vedlikehold?».',o:[
  ['Direktøren stiller til intervju, beklager, forklarer fakta og tiltak og viser omsorg for de syke',10,'Du håndterer mening, ikke bare informasjon. Etos, patos og logos virker sammen, og du deltar i innrammingen av årsak og ansvar.'],

 ]},
{id:'c4',tema:'Sosiale medier og nye medieomgivelser',title:'Storm i kommentarfeltet',

 {t:'Det ligger 200 kommentarer og venter. Hvordan svarer dere?',o:[
  ['Personlige og hjelpsomme svar med konkret informasjon om alternativ transport og refusjon',10,'PARC i praksis: deltakende, autentisk, ressursfull og troverdig.'],
  ['Limer inn «Vi beklager ulempene dette medfører» på alle',-6,'Upersonlige standardsvar svekker relasjonen selv om dere teknisk sett har svart.'],

 {t:'En video med tittelen «Kystekspressen gir blaffen i pendlerne» får 40 000 visninger på kvelden.',o:[
  ['Møter kritikken tidlig og åpent der den foregår, med fakta og en beklagelse',8,'Du kjenner igjen crescendo-effekten og griper inn før saken blir en storm.'],
  ['Ignorerer den, de som er sinte blir uansett ikke fornøyde',-6,'Selektiv eksponering gjør at kritikerne bekrefter hverandre. Taushet gir dem rett.'],
  ['Truer med advokat hvis videoen ikke fjernes',-12,'Makten har flyttet seg til sluttbrukeren. Trusselen blir neste video.']]},
 {t:'Uværet har gitt seg. Hvordan lærer dere av dette?',o:[
  ['Bruker review mining og sentimentanalyse på henvendelsene og justerer varslingsrutinene',8,'Aktiv lytting gir innsikt som brukes til å forbedre selve tjenesten.'],

  ['Ingenting, uvær kan ingen gjøre noe med',-4,'Kritikken handlet om informasjonen, ikke været.']]},
 {t:'Hvordan bygger dere relasjonen til pendlerne på lengre sikt?',o:[
  ['Oppretter et pendlerpanel som er med og former varslingen, og deler historier fra mannskapet',10,'Toveisdialog, virtuelle fellesskap og storytelling. Engasjerte interessenter kan bli talsmenn.'],
  ['Satser på flere kampanjer med tilbud og konkurranser',-4,'Broadcasting i et crowd-casting-landskap. Det bygger rekkevidde, ikke relasjon.'],
  ['Legger ned Facebook-siden for å slippe bråk',-8,'Samtalen fortsetter uten dere, og reisende som søker informasjon for å redusere usikkerhet finner bare andres versjon.']]}
 ]}

{id:'s1',src:'Studiespørsmål A1',title:'Additive og substitutive endringer',

  {l:'Additive berører deler av organisasjonen på kort sikt',k:['deler av','kort sikt','effektivitet']},

  {l:'Additive krever praktisk informasjon og opplæring',k:['praktisk informasjon','opplæring']},

 m:['<b>Additive (videreførende):</b> Inkrementelle, mindre justeringer som bygger på det eksisterende rammeverket. Berører gjerne deler av organisasjonen og retter seg mot effektivitet på kort sikt. Eksempel: digital rutine for renholdsskjemaer på nettbrett.',
  '<b>Substitutive (nyskapende):</b> Omfattende, dyptgripende endringer som utfordrer status quo, gjelder hele organisasjonen og har langsiktige konsekvenser for kultur, struktur og strategi. Eksempel: hotellkjeden går over til heldigitalisert, ubemannet drift med sentralisert kundeservice.',
  '<b>Betydning for kommunikasjon:</b> Additive endringer krever primært praktisk informasjon og opplæring for de direkte berørte. Substitutive krever sterk lederforankring, emosjonell støtte, meningsskaping og brede involveringsprosesser for å dempe usikkerhet og bygge felles forståelse.']},

{id:'s3',src:'Studiespørsmål A3',title:'Motstand mot endring',

 r:[{l:'Egeninteresse: frykt for tap av goder, status, vakter eller arbeidsplass',k:['egeninteresse','tap av','status','vakter'],n:2},
  {l:'Usikkerhet om egen kompetanse og fremtid',k:['kompetanse','fremtid']},
  {l:'Negative erfaringer fra tidligere endringer',k:['negative erfaring','tidligere endring']},
  {l:'Ulike vurderinger og mål mellom ledelse og ansatte',k:['ulike vurdering','ulike mål','uenig']},

  {l:'Sikkerhetsventil',k:['sikkerhetsventil']},
  {l:'Avdekker blinde flekker og praktiske svakheter',k:['blinde flekker','svakhet','feil i']},
  {l:'Gir et mer treffsikkert og robust resultat',k:['treffsikker','robust','bedre løsning']}],
 m:['<b>Årsaker:</b> Egeninteresse (frykt for tap av goder, status, vakter eller arbeidsplass), usikkerhet om egen kompetanse og fremtid, negative erfaringer fra tidligere endringer, og ulike vurderinger og mål mellom ledelse og ansatte.',

{id:'s4',src:'Studiespørsmål A4',title:'De fem budskapsstrategiene',

  {l:'Tell & Sell: ledelsen forteller og selger inn',k:['tell & sell','tell and sell','tell&sell']},
  {l:'Underscore & Explore: kjernebudskap og dialog',k:['underscore']},
  {l:'Identify & Reply: svarer på ansattes bekymringer',k:['identify']},
  {l:'Withhold & Uphold: holder tilbake informasjon',k:['withhold']},
  {l:'Effektivitet: lav, moderat, høyest (omvendt U-kurve)',k:['effektivitet','u-kurve','moderat','høyest'],n:2},
  {l:'Withhold skaper rykter',k:['rykte']},

 m:['<b>De fem strategiene (Cornelissen, 2023, s. 260):</b> Spray & Pray (mye informasjon ukritisk til alle, lav effektivitet). Tell & Sell (ledelsen forteller og «selger» fordelene, moderat). Underscore & Explore (tydelige kjernebudskap med aktiv lytting og dialog, høyest). Identify & Reply (lytter til ansattes bekymringer og svarer, moderat). Withhold & Uphold (holder tilbake informasjon, lav effektivitet, skaper rykter).',

{id:'s5',src:'Studiespørsmål A5',title:'Effektivitet og konsensus',
 text:'Forklar hvordan hensynet til tids- og ressursbruk og behovet for konsensusbygging kan påvirke valg av endringskommunikasjonsstrategi.',
 b:['Ta utgangspunkt i «Need to know», «Quid pro quo», «Equal dissemination» og «Equal participation».','Drøft fordeler og begrensninger ved å informere medarbeidere sammenlignet med å involvere dem.'],

  {l:'Need to know: høy effektivitet, lav konsensus',k:['need to know']},
  {l:'Quid pro quo: høy effektivitet, høyt behov for konsensus',k:['quid pro quo']},
  {l:'Equal dissemination: bred og lik informasjonsdeling',k:['equal dissemination']},
  {l:'Equal participation: tidkrevende, maksimal involvering',k:['equal participation']},
  {l:'Informere: sparer tid og gir kontroll under tidspress',k:['sparer tid','kontroll','tidspress'],n:2},
  {l:'Informere: lavt eierskap, kan gi mistillit og motstand',k:['eierskap','mistillit']},
  {l:'Involvere: forståelse, engasjement, bedre løsninger, lojalitet',k:['engasjement','bedre løsning','lojalitet','forståelse'],n:2},
  {l:'Involvere: tidkrevende, omstendelig, endringstretthet',k:['tidkrevende','omstendelig','endringstretthet'],n:1}],
 m:['<b>Strategimatrisen:</b> To akser, behov for kommunikasjonseffektivitet (tid/ressurser) og behov for konsensusbygging. Need to know: høy effektivitet, lav konsensus, bare det nødvendigste deles raskt. Quid pro quo: høy effektivitet og høyt behov for konsensus, målrettet utveksling. Equal dissemination: lav effektivitet, lavt behov for konsensus, bred og lik deling til alle. Equal participation: lav effektivitet, men maksimal konsensus og involvering.',
  '<b>Informere (enveis):</b> Sparer tid og lar ledelsen beholde kontrollen under tidspress. Gir lavt eierskap og kan trigge mistillit og motstand.',
  '<b>Involvere (toveis):</b> Gir dyp forståelse, høyt engasjement, bedre løsninger og sterkere lojalitet. Er svært tidkrevende, kan oppleves omstendelig i en akutt situasjon og risikerer endringstretthet.']},
{id:'s6',src:'Studiespørsmål A6',title:'Case: digital selvinnsjekking',
 text:'Et hotell skal innføre digital selvinnsjekking. Noen medarbeidere frykter færre vakter, mens andre ser muligheter for mer tid til gjestene.',
 b:['Bruk Clampitts Iceberg-modell til å analysere situasjonen.','Foreslå kommunikasjonstiltak.'],
 r:[{l:'Iceberg-modellen med nivåer under og over vannlinjen',k:['iceberg','isfjell','vannlinje'],n:1},
  {l:'Kontekstuell analyse: konkurranse, effektivitetskrav, gjesteforventninger',k:['kontekst','konkurranse','forventning'],n:2},
  {l:'Publikumsanalyse: splittede medarbeidere',k:['publikumsanalyse','splittet','frontdesk','resepsjon'],n:1},
  {l:'Trygghetsbehov mot mulighet for personlig vertskap',k:['trygghet','vertskap']},
  {l:'Strategi: bygge trygghet og avkrefte rykter',k:['rykte','avkreft','bygge trygghet']},
  {l:'Felles visjon: fjerne rutineoppgaver, ikke mennesker',k:['rutineoppgave','visjon','frigjøre']},
  {l:'Taktikk: talsperson med troverdighet',k:['talsperson','direktør']},
  {l:'Taktikk: rik kanal som allmøte',k:['allmøte','rik kanal']},
  {l:'Sikkerhetsventil: åpne og anonyme spørsmål',k:['sikkerhetsventil','anonym']},
  {l:'Involvering: arbeidsgruppe i god tid før lansering',k:['arbeidsgruppe','teste','i god tid']},
  {l:'Eierskap som snur frykt til engasjement',k:['eierskap']}],
 m:['<b>Under vannlinjen, kontekst:</b> Hotellet opererer i et konkurranseutsatt marked med krav til effektivitet og gjesteforventninger om sømløs digital flyt. Tidligere toppstyring kan ha skapt skepsis rundt bemanning.',
  '<b>Publikumsanalyse:</b> Medarbeiderne er splittet. Frontdesken frykter kutt i vakter (trygghetsbehov), andre ser muligheten til å gå fra transaksjonsarbeid til verdiskapende personlig vertskap.',
  '<b>Strategi:</b> Bygge trygghet, avkrefte rykter om nedbemanning og samle organisasjonen om en visjon: digitalisering skal fjerne rutineoppgaver, ikke mennesker, og frigjøre tid til vertskap.',
  '<b>Tiltak 1 (informasjon, talsperson, sikkerhetsventil):</b> Fysisk allmøte (rik kanal) ledet av hotelldirektøren, med konkrete bemanningsplaner som viser at rollene utvikles til gjesteverter. Mulighet for åpne og anonyme spørsmål.',
  '<b>Tiltak 2 (involvering og tidspunkt):</b> Arbeidsgruppe med ansatte fra resepsjonen i god tid før lansering, som utformer nye oppgaver og tester løsningen. Det skaper eierskap og snur frykt til engasjement.']},
{id:'b1',src:'Studiespørsmål B1',title:'CSR og trippel bunnlinje',
 text:'Forklar hva samfunnsansvar (CSR) og trippel bunnlinje innebærer.',
 b:['Gi et eksempel fra en servicevirksomhet som viser hvordan økonomiske, sosiale og miljømessige hensyn kan komme i konflikt.','Hvorfor er slike avveininger relevante for virksomhetens kommunikasjon?'],
 r:[{l:'CSR: ansvar for total påvirkning på mennesker, miljø og samfunn',k:['påvirkning','mennesker','samfunn'],n:2},
  {l:'Trippel bunnlinje nevnes',k:['trippel bunnlinje','triple bottom']},
  {l:'Profits: økonomisk levedyktighet',k:['profit','økonomi']},
  {l:'People: sosiale hensyn og arbeidsvilkår',k:['people','sosiale hensyn','arbeidsvilkår','arbeidsmiljø']},
  {l:'Planet: miljø- og klimaansvar',k:['planet','miljø']},
  {l:'Eksempel: kutt i plast eller matsvinn krever investeringer',k:['plast','matsvinn','investering']},
  {l:'Eksempel: bemanningskutt gir arbeidspress',k:['bemanning','arbeidspress']},
  {l:'Åpen og nyansert kommunikasjon om avveiningene',k:['åpent','nyansert','dilemma','avvein']},
  {l:'Feilfri fremstilling svekker troverdighet',k:['troverdighet','feilfri']},
  {l:'Risiko for anklager om grønnvasking',k:['grønnvask','greenwash']}],
 m:['<b>CSR og trippel bunnlinje:</b> CSR er virksomhetens ansvar for sin totale påvirkning på mennesker, miljø og samfunn. Trippel bunnlinje deler dette i Profits (økonomisk levedyktighet), People (sosiale hensyn og arbeidsvilkår) og Planet (miljø- og klimaansvar).',
  '<b>Konflikt:</b> Et hotell vil kutte plastforbruk og matsvinn (Planet), noe som krever investeringer og dyrere innkjøp (Profits). Kutt i bemanning for å opprettholde lønnsomheten kan gi økt arbeidspress og dårligere arbeidsmiljø (People).',
  '<b>Relevans for kommunikasjon:</b> Virksomheter bør kommunisere åpent og nyansert om avveiningene. De som fremstiller seg som feilfrie og grønne uten å anerkjenne dilemmaene, mister troverdighet og risikerer anklager om grønnvasking.']},
{id:'b2',src:'Studiespørsmål B2',title:'Informasjon, respons og involvering',
 text:'Gjør rede for de tre strategiene for kommunikasjon om samfunnsansvar: informasjon, respons og involvering.',
 b:['Forklar forskjellen på å innhente synspunkter og å gi interessenter reell innflytelse.','Bruk et eksempel på samarbeid med lokalsamfunnet, og drøft hvordan kommunikasjon og oppfølging kan påvirke tillit og omdømme.'],
 r:[{l:'Informasjon: enveis rapportering om tiltak og resultater',k:['enveis','rapporter']},
  {l:'Respons: toveis, innhenter synspunkter og justerer',k:['toveis','tilbakemelding','juster'],n:2},
  {l:'Involvering: utvikler løsninger sammen i partnerskap',k:['partnerskap','medskap','sammen','medvirkning']},
  {l:'Innhente synspunkter: bedriften beholder beslutningsmakten',k:['beslutningsmakt','beholder']},
  {l:'Reell innflytelse: interessentene former beslutningene',k:['reell innflytelse','ved bordet','forme beslutning']},
  {l:'Eksempel på samarbeid med lokalsamfunnet',k:['kommune','skole','praksisplass','ungdom','lokalsamfunn']},
  {l:'Corporate citizenship',k:['corporate citizenship','bedriftsborger','samfunnsaktør']},
  {l:'Transparens og oppfølging over tid styrker tillit',k:['transparen','følges opp','over tid','resultat'],n:2},
  {l:'Tom PR uten oppfølging slår tilbake som uautentisk',k:['uautentisk','tom pr','slår tilbake']}],
 m:['<b>De tre strategiene:</b> Informasjon (enveis rapportering om tiltak og resultater, for eksempel tall for utslipp eller matsvinn). Respons (toveis: innhenter synspunkter, svarer på kritikk og justerer praksis). Involvering (medskaping: virksomhet og interessenter utvikler løsninger sammen i et jevnbyrdig partnerskap).',
  '<b>Innhenting mot reell innflytelse:</b> Ved innhenting spør bedriften om meninger, men beholder all beslutningsmakt. Ved reell innflytelse sitter interessentene ved bordet og er med på å forme beslutninger og tiltak.',
  '<b>Eksempel og omdømmeeffekt:</b> Et hotell samarbeider med kommunen og den lokale videregående skolen om praksisplasser og arbeidstrening (corporate citizenship). Er kommunikasjonen transparent, viser reelle resultater og følges opp over tid, styrkes tilliten og omdømmet. Brukes det som tom PR uten oppfølging, slår det tilbake som uautentisk.']},
{id:'b3',src:'Studiespørsmål B3–5',title:'Case: Green Hotels og grønnvasking',
 text:'Green Hotels (GH) markedsfører seg som bærekraftig. En gjest påpeker matkasting på sosiale medier, og troverdigheten til GH blir utfordret.',
 b:['Hva bør GH undersøke, hvordan bør de møte kritikken, og hvordan bør de følge opp?','Hva innebærer grønnvasking, og hvilket informasjonsbehov oppstår?','Hvordan kan GH gjøre kommunikasjonen mer troverdig?'],
 r:[{l:'Undersøker avfallslogger og rutiner for gap mellom påstand og praksis',k:['avfallslogg','rutine','logistikk','gap mellom'],n:1},
  {l:'Unngår defensiv sletting av kommentarer',k:['slett']},
  {l:'Svarer raskt, ærbødig og transparent, og er ærlig om forbedringspotensial',k:['raskt','transparent','ærlig','anerkjenn'],n:2},
  {l:'Konkrete tiltak mot svinn og kommunikasjon av dokumenterte resultater',k:['too good to go','veldedig','konkrete tiltak','dokumenterte']},
  {l:'Grønnvasking: avstand mellom ord og handling',k:['ord og handling','mer miljøvennlig enn','faktisk']},
  {l:'Uavhengig og etterprøvbar dokumentasjon',k:['uavhengig','etterprøvbar']},
  {l:'Hva som må dokumenteres: utslipp, forbruk, matsvinn, innkjøp',k:['utslipp','energi','vannforbruk','matsvinntall','innkjøp'],n:2},
  {l:'Tredjepartssertifisering',k:['sertifiser','miljøfyrtårn','svanemerke','tredjepart']},
  {l:'Tallfestet dokumentasjon og ekstern verifisering',k:['tallfest','verifiser','miljøregnskap']},
  {l:'Forankring i Global Compact eller OECD',k:['global compact','oecd']},
  {l:'Samsvar mellom ord og handling: atferd i CI-mixen',k:['ci-mix','atferd','samsvar']}],
 m:['<b>Undersøke:</b> Sjekk kjøkkenets avfallslogger, rutiner og logistikk for matsortering for å avdekke om det er gap mellom påstander og praksis.',
  '<b>Møte kritikken:</b> Unngå defensiv sletting. Svar raskt, ærbødig og transparent: anerkjenn innspillet, takk for tilbakemeldingen og vær ærlig om hva som gjøres og hvor det er forbedringspotensial.',
  '<b>Følge opp:</b> Etabler konkrete tiltak for å redusere svinn (for eksempel samarbeid med Too Good To Go eller lokale veldedige organisasjoner) og kommuniser de dokumenterte resultatene.',
  '<b>Grønnvasking:</b> Når en virksomhet bruker markedsføring og kommunikasjon til å fremstille seg som mer miljøvennlig eller samfunnsansvarlig enn den faktisk er. Informasjonsbehov: uavhengig og etterprøvbar dokumentasjon på utslipp, energi- og vannforbruk, matsvinntall, innkjøpsrutiner og tredjepartssertifiseringer, og innsyn i om tiltakene gjelder hele driften.',
  '<b>Mer troverdig:</b> Full transparens, tallfestet dokumentasjon og ekstern verifisering. Publiser sporbare miljøregnskaper med både fremskritt og utfordringer, forankre arbeidet i FNs Global Compact og OECDs retningslinjer, og sikre samsvar mellom ord og handling (atferd i CI-mixen).']}
];

 ['Hva vektlegges',ul(['God struktur og oversiktlig fremstilling.','Relevante teorier og begreper fra pensum og forelesninger.','Integrering av stoff fra ulike deler av pensum.','Selvstendig refleksjon.','Unngå synsing: alle påstander og anbefalinger skal begrunnes faglig og knyttes til eksempler fra serviceorganisasjoner.'])],
 ['Karakterbeskrivelser',tb([['Karakter','Hva som kreves i BDS110'],['A – Fremragende','Høyt kunnskapsnivå og særdeles god forståelse. Teorier og begreper presenteres, drøftes og eksemplifiseres presist, faglig sikkert og reflektert.'],['B – Meget god','God forståelse og innsikt. Teorier presenteres klart og drøftes og eksemplifiseres på en akseptabel måte.'],['C – God','Tilfredsstillende innsikt på de fleste områder. Presentasjon, drøfting og eksempler er i hovedsak klare.'],['D – Nokså god','Innsikt i deler av emnet, men upresise formuleringer, faglig usikkerhet og mangler i forståelsen.'],['E – Tilstrekkelig','Begrenset kunnskap og manglende oversikt. Store hull og begreper som er mangelfullt eller feil gjengitt.'],['F – Ikke bestått','Svært begrenset innsikt.']])],
 ['Oppskrift på sterk drøfting','<p>En sterk besvarelse viser sammenhengen mellom kontekst og fase, interessentenes reaksjoner, strategivalg og kanalvalg. Bygg hvert poeng slik:</p>'+ul(['<b>Situasjon og fase:</b> Hva skjer, hvem berøres, og hva er usikkert?','<b>Teoretisk begrunnet valg:</b> Hvilken tilnærming, strategi og hvilke kanaler passer? Begrunn med modeller fra pensum.','<b>Vurdering:</b> Hvorfor kan valget virke, under hvilke betingelser, og hvilke alternativer, begrensninger og risikoer finnes?'])],
 ['Emnets oppbygning: HVA, HVEM, HVORDAN',ul(['<b>HVA:</b> begreper og teoretisk rammeverk. Organisasjonskommunikasjon i digital kontekst, medier og kanaler, plattformer, KI og kommunikasjonsmodeller (dialog mot informasjon).','<b>HVEM:</b> interessentene. Interne, eksterne, primære og sekundære, sett i lys av relasjoner, kanalvalg, kundeopplevelse, mangfold, makt og virtuelle team.','<b>HVORDAN:</b> strategi og praksis. Kommunikasjonsstrategi, endrings- og krisekommunikasjon, identitet og omdømme, retorikk og storytelling, interkulturell kommunikasjon og etikk.'])]],
m1:[
 ['Hva er organisasjonskommunikasjon?','<p>«En rekke prosesser gjennom hvilke organisasjoner skaper, forhandler og håndterer mening» (Cheney & Christensen, 2001). Kommunikasjon er altså mer enn enveis overføring av budskap. Det handler om meningsskaping, relasjon og organisering. Dette er forskjellen på overføringsperspektivet og delingsperspektivet.</p>'],
 ['To syn på organisasjonskommunikasjon',ul(['<b>Kommunikasjon i organisasjonen:</b> organisasjonen er en beholder eller struktur som informasjon flyter i.','<b>Kommunikasjon er organisasjonen:</b> organisasjonen blir til og formes gjennom kommunikasjon. Kommunikasjon er selve byggesteinen.'])],
 ['PR-tradisjonens perspektiver',ul(['Kommunikasjon håndterer relasjonene mellom organisasjonen og omverdenen.','Kommunikasjon er en ledelsesfunksjon og en integrert del av strategiarbeidet: planlegging, utføring og evaluering.','Den kan være asymmetrisk (organisasjonen påvirker eller overtaler) eller symmetrisk (likeverdig dialog).'])],
 ['Digitisering, digitalisering og digital transformasjon',ul(['<b>Digitisering:</b> analog informasjon gjøres digital, for eksempel papirskjemaer som skannes.','<b>Digitalisering:</b> digital teknologi brukes til å endre og effektivisere arbeidsprosesser og samhandling.','<b>Digital transformasjon:</b> dyptgripende omstilling der teknologi endrer forretningsmodell, kultur og verdiskaping.'])+'<p>Digitalisering påvirker organisasjoner på makronivå (samfunn og bransje), mesonivå (organisasjonen) og mikronivå (den enkelte og teamet).</p>'],
 ['Nye former for arbeid','<p>Fjernsamarbeid, distribuerte team, gig-arbeid og digitale nomader. Digital kompetanse blir viktigere. Dette er kjennetegn ved internett- og nettverkssamfunnet.</p>'],
 ['Teknologiakseptansemodellen (TAM)','<p>Forklarer om ansatte og kunder tar i bruk ny teknologi. To faktorer avgjør: <b>opplevd nytte</b> (hjelper dette meg?) og <b>opplevd brukervennlighet</b> (er det lett å bruke?). Eksempel: resepsjonister som ser nytten av et nytt bookingsystem, men ikke bruker det fordi det er tungvint.</p>'],
 ['Datamediert kommunikasjon (CMC)',ul(['<b>Synkron CMC:</b> kommunikasjon i sanntid, som videomøter og live chat.','<b>Asynkron CMC:</b> tidsforskjøvet kommunikasjon, som e-post, intranett og diskusjonsfora.'])],
 ['Kritisk bruk av IKT og KI','<p>Digital teknologi kan være både <b>kanal</b> og <b>kommunikativ aktør</b>. Generativ KI, chatboter og automatisert kundeservice gir effektivisering og personalisering, men reiser spørsmål om ansvar, tillit og behovet for menneskelig skjønn.</p>']],
m2:[
 ['van Riels modell for virksomhetskommunikasjon','<p>Misjon og visjon, strategi, identitet og image er et felles utgangspunkt som styrer og samordner tre områder: <b>ledelseskommunikasjon</b>, <b>organisasjonskommunikasjon</b> og <b>markedskommunikasjon</b>. Områdene påvirker hverandre gjensidig.</p>'],
 ['Historisk utvikling (Cornelissen, 2023)',ul(['<b>1900–1970-tallet:</b> publicity, promotering og informasjonsspredning. Kommunikasjon som taktisk støtte.','<b>1980–2000-tallet:</b> posisjonering.','<b>2000-tallet til i dag:</b> stakeholder engagement. Kommunikasjon som strategisk verktøy, med nøkkelbegrepene advocacy (talsmannskap), interactivity, transparency og authenticity.'])],
 ['Engasjement som kjerneprinsipp','<p>Engasjement er mer enn å dele meninger. Organisasjonen må være transparent, engasjere på ulike plattformer og handle autentisk. Når det er sammenheng mellom det man sier og gjør, kan interessentene bli talsmenn for virksomheten.</p>'],
 ['Integrert virksomhetskommunikasjon','<p>Drivere for integrasjon er markeds- og miljøbaserte, kommunikasjonsbaserte og organisatoriske. Kommunikasjonen bygger på samspillet mellom <b>eide, betalte og fortjente medier</b> (POEM): egne kanaler, annonsering og omtale andre gir deg.</p>'],
 ['Tradisjonelle og nye medieomgivelser',tb([['Dimensjon','Tradisjonelle','Nye'],['Tilnærming','Broadcasting: interessentene er publikum som mottar kontrollerte budskap','Crowd-casting: interessentene produserer og sprer innhold selv'],['Modell','En-til-mange','Mange-til-en og mange-til-mange'],['Prinsipp','Corporate positioning: planlagt og kontrollert overføring','Content generation: spontan og fri spredning av innhold'],['Metaforer','Medium og kanaler','Plattformer og arenaer'],['Spilleregler','Faste og kontrollerte','Uoversiktlige og fremvoksende'],['Terskel for å publisere','Dyr og høy','Billig og lav']])]],
m3:[
 ['Endrede spilleregler','<p>Sosiale medier flytter virksomhetskommunikasjon fra <b>kommando og kontroll</b> til <b>kommunikasjon og fellesskap</b>. Nye utfordringer: tap av kontroll over informasjonsflyten, maktskifte til sluttbrukeren, flytende grenser mellom jobb og fritid og mellom privat og offentlig, og behov for aktiv lytting.</p>'],
 ['Klassifisering av sosiale medier',tb([['','Lav sosial tilstedeværelse/medierikhet','Medium','Høy'],['Høy selvpresentasjon','Blogger','Sosiale nettverkssider (Facebook)','Virtuelle sosiale verdener (Second Life)'],['Lav selvpresentasjon','Samarbeidsprosjekter (Wikipedia)','Innholdsfellesskap (YouTube)','Virtuelle spillverdener (World of Warcraft)']])],
 ['Sentrale teorier',ul(['<b>Medierikhetsteori:</b> kanalvalget bør passe budskapets tvetydighet. Rike medier (ansikt til ansikt, video) gir rask tilbakemelding og mange signaler. Magre medier (skriftlige dokumenter, e-post) passer til entydig informasjon.','<b>Usikkerhetsreduksjon (URT):</b> vi søker informasjon, som gjesteanmeldelser, for å redusere usikkerhet før vi velger.','<b>Social Information Processing (SIP):</b> relasjoner utvikles på nett over tid gjennom språklige og tidsmessige signaler, selv uten fysiske ledetråder.','<b>Uses and Gratifications:</b> brukere er aktive og velger medier for å dekke behov som informasjon, sosial kontakt, underholdning og selvrealisering.'])],
 ['Hvordan sosiale medier påvirker oss',ul(['<b>Selektiv eksponering:</b> vi oppsøker innhold som bekrefter det vi allerede mener.','<b>Crescendo-effekt:</b> kritikk eskalerer raskt og bygger seg opp til en storm.','<b>Overvåkning og personvern:</b> etiske og juridiske utfordringer ved datainnsamling og sporing.','<b>Problematisk bruk:</b> internettavhengighet, FOMO (frykt for å gå glipp av noe) og phubbing (å overse dem man er sammen med til fordel for mobilen).','<b>Sosial kapital:</b> digitale nettverk skaper tillit, tilhørighet og ressurser.'])],
 ['Servicevirksomheters bruk',ul(['Sosiale samhandlingsløsninger internt (Enterprise 2.0), omdømmehåndtering og rekruttering.','Plattformer og apper som en del av tjenesten og kundeopplevelsen.','Lytting og analyse: review mining (analyse av anmeldelser), sentimentanalyse (positiv og negativ stemning) og topic modeling (hovedtemaer i store tekstmengder).','Algoritmer og KI i produksjon, distribusjon, personalisering og interaksjon.'])],
 ['Styrke relasjoner: PARC','<p>Virkemidler er personalisering, toveiskommunikasjon, storytelling, virtuelle fellesskap og integrasjon av digitale og tradisjonelle medier. PARC-prinsippene sier at kommunikasjonen bør være <b>Participatory</b> (deltakende), <b>Authentic</b> (autentisk), <b>Resourceful</b> (ressursfull) og <b>Credible</b> (troverdig).</p>']],
m4:[
 ['Ukonvensjonell datamediert kommunikasjon','<p>Gjesteforelesning med Dr. Hong Li. Temaet er måter å bruke datamediert kommunikasjon på utover vanlige tekst- og videomeldinger, og hvordan slike former påvirker kommunikasjon over lange avstander.</p>'],
 ['Flexi Card Game','<p>Et praktisk og kreativt designverktøy for å utforske digital kommunikasjon.</p>'],
 ['Hva som er viktig i slike verktøy','<p>Verktøyene bør fremme <b>nærhet</b> og <b>emosjonell kommunikasjon</b>. I organisasjoner kan ukonvensjonelle former brukes til å styrke samhold og samhandling, for eksempel i team som sitter på ulike steder.</p>']],
m5:[
 ['Grunnprinsipp','<p>«En digital kommunikasjonsstrategi begynner ikke med Instagram.» Strategi handler om begrunnede valg. Det overordnede målet er at virksomhetens <b>omdømme</b> skal være i tråd med <b>visjonen</b>. Gapet mellom de to er det strategiske problemet.</p>'],
 ['De sju stegene i strategisk kommunikasjonsplanlegging',ul(['<b>Steg 1 – Strategisk intensjon:</b> hva er det overordnede grepet?','<b>Steg 2 – Kommunikasjonsmål:</b> hva vil vi oppnå?','<b>Steg 3 – Målgrupper:</b> hvem må vi nå, og hvem er viktigst?','<b>Steg 4 – Tematiske budskap:</b> hva skal vi kommunisere?','<b>Steg 5 – Budskapsstil:</b> hvordan skal vi si det?','<b>Steg 6 – Mediestrategi:</b> hvor skal kommunikasjonen foregå?','<b>Steg 7 – Budsjett og evaluering:</b> hvordan vet vi om det virker, og hva må justeres?'])],
 ['Strategiprosesser',ul(['<b>Rasjonell:</b> analytisk og planlagt steg for steg.','<b>Visjonær:</b> styrt av en sterk, samlende fremtidsvisjon.','<b>Inkrementell:</b> gradvis utprøving, læring og tilpasning.'])],
 ['Budskapsstiler',ul(['<b>Funksjonelle budskap:</b> konkrete egenskaper, fakta, pris og nytte.','<b>Symbolske budskap:</b> verdier, følelser, livsstil og identitet.','<b>Bransjeorienterte budskap:</b> posisjonering mot konkurrenter og standarder i bransjen.'])]],
m6:[
 ['Typer interessenter','<p><b>Interne</b> og <b>eksterne</b>. <b>Primære</b> er nødvendige for drift og overlevelse, som gjester, ansatte og eiere. <b>Sekundære</b> påvirker eller påvirkes indirekte.</p>'],
 ['Interessentmodellen','<p>Organisasjonen står i sentrum med gjensidige relasjoner til myndigheter, investorer, politiske grupper, kunder, lokalsamfunn, ansatte, bransjeorganisasjoner og leverandører. Pilene går begge veier.</p>'],
 ['Stakeholder Salience Model (Mitchell, Agle & Wood)','<p>Vurderer hvor fremtredende en interessent er ut fra <b>makt</b>, <b>legitimitet</b> og <b>hast</b>.</p>'+tb([['Type','Har','Betydning'],['Definitive','Makt, legitimitet og hast','Høyeste prioritet, umiddelbart'],['Dominant','Makt og legitimitet','Viktig, men det haster ikke'],['Dangerous','Makt og hast','Kan være truende'],['Dependent','Legitimitet og hast','Avhengig av andre for å få makt'],['Dormant','Kun makt','Sovende'],['Discretionary','Kun legitimitet','Opp til virksomheten'],['Demanding','Kun hast','Støyende, men uten makt eller legitimitet'],['Non-stakeholder','Ingen','Ikke interessent']])],
 ['Makt-interesse-modellen',tb([['','Lav interesse','Høy interesse'],['Høy makt','Keep satisfied: hold fornøyd','Key players: involver tett'],['Lav makt','Minimal effort: overvåk','Keep informed: hold løpende informert']])],
 ['Strategier og utvikling','<p>Tre kommunikasjonsstrategier: <b>informasjon</b> (enveis), <b>overtalelse</b> (asymmetrisk påvirkning) og <b>dialog</b> (symmetrisk samhandling). Utviklingen går fra ensidig ledelse (management) til gjensidig samarbeid (collaboration), og fra passiv bevissthet til aktivt engasjement.</p>']],
m7:[
 ['CI-mix (Corporate Identity-mix)','<p>Virksomhetens kultur og historie legger grunnlaget for strategien, som kommer til uttrykk gjennom CI-mixen. Den utgjør virksomhetens personlighet:</p>'+ul(['<b>Atferd (Behaviour):</b> hvordan ansatte og ledere opptrer i praksis.','<b>Kommunikasjon (Communications):</b> planlagte budskap og dialog.','<b>Symbolisme (Symbolism):</b> visuell identitet, logo, design, klær og lokaler.'])+'<p>CI-mixen former virksomhetsomdømmet, som påvirker organisatoriske og finansielle resultater, salg, miljø og HRM (rekruttering og tilknytning).</p>'],
 ['Tre identitetsstrukturer',ul(['<b>Monolittisk:</b> ett felles navn og én visuell stil i hele organisasjonen.','<b>Støttet (endorsed):</b> underenheter har egne navn, men støttes synlig av morselskapets navn og omdømme.','<b>Merkevarebasert (branded):</b> frittstående merkevarer uten synlig kobling til morselskapet.'])],
 ['VCI-modellen og gap-analyse','<p>Omdømme bygges ved samsvar mellom tre elementer:</p>'+ul(['<b>Vision:</b> hva ledelsen ønsker å oppnå.','<b>Culture:</b> hvordan de ansatte tenker, føler og handler.','<b>Image:</b> hvordan eksterne interessenter oppfatter virksomheten.'])+'<p>Kommunikasjonens oppgave er å avdekke og lukke gapene: <b>Image-Vision Gap</b>, <b>Vision-Culture Gap</b> og <b>Image-Culture Gap</b>.</p>']],
m8:[
 ['Hvorfor internkommunikasjon','<p>Målet er informerte, involverte og inkluderte medarbeidere, og sterkere tilhørighet og engasjement. Internkommunikasjon har fire funksjoner: <b>sosial</b>, <b>ekspressiv</b>, <b>informasjon</b> og <b>kontroll</b>.</p>'],
 ['Internkommunikasjonshjulet','<p>Viser hvordan IK knytter sammen ledelse, administrasjon, personalpolitikk, bedriftskultur, profilering, markedsføring, ekstern informasjon og pressekontakt. Det skjer gjennom verdier og praksiser som åpenhet, lojalitet, ytringsfrihet, motivasjon, likeverdig dialog, formelle og uformelle kontakter, fagforeninger, opplæring, IKT, rutiner og lederstil.</p>'],
 ['Sentrale spenninger',ul(['Kommunikasjon <b>oppover og nedover</b>.','<b>Informere</b> (enveis) mot <b>engasjere</b> (toveis).','<b>Formell</b> og <b>uformell</b> kommunikasjon («ryktebørsen»).','<b>Ledelseskommunikasjon</b> (personlig, fra ledere) mot <b>CICS</b>, bedriftens informasjons- og kommunikasjonssystemer som intranett og nyhetsbrev.','<b>Medarbeiderstemme</b> (employee voice) mot <b>organisatorisk taushet</b>. Hva det blir avhenger av psykologisk trygghet.'])],
 ['Digital internkommunikasjon','<p>Sosiale medier for bedrifter (Enterprise Social Media) kan gi kunnskapsdeling og samhold på tvers av lokasjoner og skift. Utfordringene er informasjonsoverbelastning, utydelige grenser og ulik digital kompetanse. Hvordan det fungerer påvirkes av teknologi, ledelse, språk og kulturelle kommunikasjonsnormer.</p>']],
m9:[
 ['Retorikk og de tre appellformene','<p>Formålet er overbevisning, identifikasjon og meningsskaping.</p>'+ul(['<b>Etos:</b> avsenders troverdighet, karakter og ekspertise.','<b>Patos:</b> appell til følelser, verdier og engasjement.','<b>Logos:</b> appell til fornuft, fakta, tall og logikk.'])+'<p>Ordvalg, metaforer, kontraster og fortellinger fremhever visse sider ved en sak og former forståelsen av ansvar og handlingsalternativer.</p>'],
 ['Digital retorikk og storytelling','<p>Digital retorikk er <b>multimodal</b> (tekst, bilde, lyd og video) og <b>situert</b> i en digital kontekst. Storytelling bygger felles identitet internt og emosjonell tilknytning eksternt. Kritisk blikk: hva støtter dokumentasjonen, og hvilke perspektiver fremheves eller utelates?</p>'],
 ['Mediehåndtering',ul(['Forstå journalistiske arbeidsmetoder: nyhetskriterier, tidspress og kilder.','Mediene har en <b>forsterkende</b> effekt på omdømmet.','<b>Agenda-setting:</b> mediene styrer hvilke saker offentligheten oppfatter som viktige.','<b>Framing (innramming):</b> vinklingen avgjør hvordan publikum tolker årsak og ansvar.','Teknikker: pressemeldinger, pressekonferanser og intervjutrening. Sosiale medier har endret landskapet og maktbalansen for tradisjonelle medier.'])]],
m10:[
 ['Hva er issues management?','<p>Å identifisere <b>issues</b> (utfordrende saker eller forventningsgap mellom organisasjonen og interessentene), analysere hvordan de utvikler seg, og håndtere dem før de eskalerer til krise. En issue utvikler seg gradvis: latent, aktiv, intens, krise.</p>'],
 ['Analyseverktøy',ul(['<b>DESTEP:</b> omgivelsesanalyse av demografiske, økonomiske, sosiale, teknologiske, økologiske og politiske forhold.','<b>SWOT:</b> styrker, svakheter, muligheter og trusler.','Medieskanning og sentimentanalyse.'])],
 ['Issue Life-Cycle','<p><b>Emergence</b> (saken oppstår og er latent) → <b>Debate</b> (offentlig debatt, saken er aktiv) → <b>Codification</b> (lovgivning og regulering utformes) → <b>Enforcement</b> (nye regler håndheves). Jo senere du går inn, jo mindre handlingsrom har du.</p>'],
 ['Position-Importance Matrix',tb([['','Minst viktig','Mest viktig'],['Motstander','Problematic','Antagonistic (høyest risiko)'],['Støttespiller','Low priority','Supporter']])],
 ['Fire responsstrategier',ul(['<b>Buffer:</b> ligge lavt og skjerme virksomheten for å unngå oppmerksomhet.','<b>Brobygging (bridging):</b> møte bekymringene gjennom dialog, samarbeid og tilpasning av praksis.','<b>Påvirkning (advocacy):</b> forsøke å endre omgivelsenes forventninger gjennom kampanjer og lobbyvirksomhet.','<b>Tankelederskap (thought leadership):</b> ta en tidlig og tydelig lederposisjon og sette standarden.'])+'<p>Buffer kan fungere for en latent sak. Når saken er intens og interessentene krever svar, svekker taushet tilliten. Da er brobygging avgjørende. Etterpå evalueres effekten på omdømme og på politikk og regulering.</p>']],
m11:[
 ['Grunnbegreper',ul(['<b>Omdømmekapital:</b> opparbeidet tillit som fungerer som buffer når krisen kommer.','Utvikling: risiko → issue → krise.','<b>Før krisen:</b> forberedelse og kriseplan. <b>Under:</b> rask handling, empati og fakta. <b>Etter:</b> evaluering, læring og gjenoppbygging.','<b>Håndtere informasjon:</b> hva har skjedd, og hva skal folk gjøre? <b>Håndtere mening:</b> hvordan fortolkes krisen og ansvaret?','Timing og sosiale medier: raske oppdateringer er mulig, men rykter sprer seg også raskt.'])],
 ['Krisetypologi',tb([['','Utilsiktet','Tilsiktet'],['Ekstern','Faux pas: uheldig feiltrinn eller uttalelse som vekker reaksjoner utenfra','Aggresjon: sabotasje, dataangrep, boikott, terror'],['Intern','Uhell: teknisk svikt, menneskelig feil','Overtredelser: bevisst lovbrudd, juks, uetisk ledelse']])],
 ['Valg av responsstrategi','<p>Valget bygger på <b>tillagt ansvar</b>, <b>omdømme</b> og <b>tidligere krisehistorikk</b>. Oppfattes organisasjonen som offer, utsatt for uhell eller intensjonelt ansvarlig? Fem strategier, fra lite til mye ansvar:</p>'+ul(['<b>Benekte (denial):</b> avvise at krisen finnes eller at man har skyld.','<b>Distansere (diminish):</b> redusere alvoret eller skylde på eksterne faktorer.','<b>Styrke posisjon (bolstering):</b> minne om tidligere gode gjerninger og verdier.','<b>Offer (victimage):</b> fremstille organisasjonen som et offer.','<b>Aksept (rebuild/apology):</b> ta fullt ansvar, be uforbeholdent om unnskyldning og tilby kompensasjon.'])]],
m12:[
 ['Typer endring',ul(['<b>Omfang:</b> videreførende (additive, små justeringer) mot nyskapende (substitutive, gjennomgripende).','<b>Drivkrefter:</b> internt drevet (nytt lederskap, nye systemer) mot eksternt drevet (teknologi, kundebehov, rammebetingelser).','<b>Initiativ:</b> toppstyrt mot medarbeiderdrevet.','<b>Kategori:</b> tekniske, strukturelle, kulturelle eller kompetanserelaterte endringer.'])+'<p>Additive endringer krever mest praktisk informasjon og opplæring. Substitutive krever lederforankring, emosjonell støtte, meningsskaping og bred involvering.</p>'],
 ['Lewins endringsmodell',ul(['<b>Oppvarming (unfreezing):</b> skape erkjennelse av at endringen er nødvendig («brennende plattform») og utfordre status quo.','<b>Endring (changing):</b> håndtere usikkerhet, forklare nye roller, lytte og holde fremdriften synlig.','<b>Nedfrysing (refreezing):</b> forankre nye vaner, feire suksesser og vise at ny praksis fungerer.'])],
 ['Kotters åtte steg',ul(['<b>Steg 1–2:</b> skape forståelse for nødvendighet og etablere en ledende koalisjon.','<b>Steg 3–4:</b> utvikle visjon og strategi og kommunisere endringsvisjonen.','<b>Steg 5–6:</b> legge til rette for handling og skape kortsiktige gevinster.','<b>Steg 7–8:</b> videreføre endringen og forankre nye arbeidsmåter i kulturen.'])+'<p>Gjennomgående hensyn: åpenhet og forutsigbarhet, god timing, konsistente budskap og balanse mellom fakta og følelser.</p>'],
 ['Motstand mot endring','<p>Årsaker: egeninteresse (frykt for tap av goder, status, vakter eller jobb), usikkerhet om egen kompetanse og fremtid, negative erfaringer, og ulike vurderinger mellom ledelse og ansatte. Møt motstand med kommunikasjon og opplæring, og med deltakelse og involvering. Kritiske røster er tidlige varslere og en sikkerhetsventil som avdekker blinde flekker.</p>'],
 ['Cornelissens fem budskapsstrategier',tb([['Strategi','Hva','Effektivitet'],['Spray & Pray','Svært mye informasjon uten prioritering','Lav'],['Tell & Sell','Forklare og overbevise om en ferdig beslutning','Moderat'],['Underscore & Explore','Tydelige hovedpoenger og dialog og involvering','Høyest'],['Identify & Reply','Identifisere bekymringer og svare på dem','Moderat'],['Withhold & Uphold','Holde tilbake informasjon','Lav (skaper rykter)']])+'<p>Dette er en omvendt U-kurve: for mye og for lite informasjon virker dårligst.</p>'],
 ['Matrisen for effektivitet og enighet',tb([['','Lavt behov for enighet','Høyt behov for enighet'],['Høyt behov for effektivitet','Need to know: bare det nødvendige, raskt','Quid pro quo: målrettet, gjensidig utveksling'],['Lavt behov for effektivitet','Equal dissemination: lik informasjon til alle','Equal participation: bred involvering']])+'<p>Å informere sparer tid og gir kontroll, men gir lavt eierskap. Å involvere gir forståelse, engasjement og bedre løsninger, men er tidkrevende og kan gi endringstretthet.</p>'],
 ['Clampitts Iceberg-modell',ul(['<b>Under vannlinjen (usynlig grunnarbeid):</b> kontekstuell analyse, publikumsanalyse og strategi.','<b>Over vannlinjen (synlig taktikk):</b> talspersoner, budskap, kanaler, valg av tidspunkt og sikkerhetsventiler (arenaer for tilbakemelding).'])+'<p>Eksamensmerknad fra foreleser: Spray & Pray og de andre budskapsstrategiene er kommunikasjonsstrategier. De er ikke nivåene i Iceberg-modellen.</p>'],
 ['Kanalvalg i ulike faser','<p>Tidlig (Kotter steg 1–4) er tvetydigheten høy. Da trengs rike kanaler som allmøter og workshops, kombinert med Underscore & Explore. Senere (steg 5–8) kombineres dialog i team med magre, skriftlige kanaler som intranett og manualer for rutiner og deling av kortsiktige gevinster.</p>']],
m13:[
 ['Grunnbegreper','<p><b>CSR</b> (Corporate Social Responsibility) er virksomhetens ansvar for sin totale påvirkning på mennesker, miljø og samfunn. <b>Corporate citizenship</b> betyr bedriftsborgerskap. <b>Trippel bunnlinje</b> deler ansvaret i tre: <b>Profits</b> (økonomi), <b>People</b> (sosiale hensyn) og <b>Planet</b> (miljø). Internasjonale standarder er FNs Global Compact og OECDs retningslinjer.</p>'],
 ['Tilnærminger og avveininger','<p>Fem tilnærminger til CSR: defensiv, veldedig, promoterende, strategisk og transformerende. Hensynene kan komme i konflikt. Eksempel: kutt i plast og matsvinn (Planet) krever investeringer (Profits), og bemanningskutt for å spare inn gir arbeidspress (People). Virksomheter bør kommunisere åpent og nyansert om slike avveininger.</p>'],
 ['Grønnvasking','<p>Når virksomheter kommuniserer grønnere eller mer ansvarlig enn det faktiske handlingsmønsteret tilsier. For å vurdere om kommunikasjonen er misvisende trengs uavhengig og etterprøvbar dokumentasjon: utslipp, energi- og vannforbruk, matsvinn, innkjøp og tredjepartssertifiseringer som Miljøfyrtårn og Svanemerket.</p>'],
 ['Tre strategier for CSR-kommunikasjon',ul(['<b>Informasjon:</b> enveis rapportering om tiltak og resultater.','<b>Respons:</b> toveis. Virksomheten innhenter synspunkter og justerer, men beholder beslutningsmakten.','<b>Involvering:</b> reell medvirkning. Virksomheten og interessentene utvikler løsninger sammen.'])],
 ['Troverdig kommunikasjon','<p>Full transparens, tallfestet dokumentasjon og ekstern verifisering. Publiser sporbare miljøregnskap med både fremskritt og utfordringer, og sørg for samsvar mellom ord og handling (atferd i CI-mixen). Samfunnsansvar som brukes som tom PR uten oppfølging slår tilbake som uautentisk.</p>']]
};

const allTerms=()=>M.flatMap(m=>m.terms.map(t=>({t:t[0],d:t[1],m:m.id})));
function expBox(ids,text){return`<details class="exp" open><summary>Forklaring av begreper og modeller</summary><div class="book">${relSecs(ids,text,2)}</div></details>`}
function relSecs(ids,text,max){const words=[...new Set((text.toLowerCase().match(/[a-zæøå&-]{5,}/g)||[]))];
 const all=ids.flatMap(id=>BOOK[id].map(s=>({s,sc:words.filter(w=>(s[0]+' '+s[1]).toLowerCase().includes(w)).length})));
 const top=all.filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,max);
 return(top.length?top:all.slice(0,max)).map(x=>`<h4>${x.s[0]}</h4>${x.s[1]}`).join('')}
function buildPool(mods){const AT=allTerms(),pool=[],mk=(m,q,right,wrong,why,extra)=>{const opts=shuffle([right,...wrong]);pool.push({mod:m,q,opts,c:opts.indexOf(right),why,...extra})};
 const others=g=>shuffle(Object.keys(GROUPS).filter(x=>x!==g));
 mods.forEach(m=>{
  m.qs.forEach(q=>mk(m,q[0],q[1],q.slice(2,5),q[5],{h:1}));
  m.terms.forEach(([t,d])=>{const same=shuffle(m.terms.filter(x=>x[0]!==t)),oth=shuffle(AT.filter(x=>x.m!==m.id));
   const dis=same.slice(0,3).map(x=>({t:x[0],d:x[1]}));while(dis.length<3)dis.push(oth.pop());
   mk(m,'Hvilket begrep passer til beskrivelsen?',t,dis.map(x=>x.t),t+': '+d,{quote:d});
   mk(m,'Hva beskriver «'+t+'» best?',d,dis.map(x=>x.d),t+': '+d)});
  Object.keys(GROUPS).filter(g=>GMOD[g]===m.id).forEach(g=>{const it=GROUPS[g],why=g+' består av: '+it.join(', ')+'.',out=()=>others(g).slice(0,3).map(o=>shuffle(GROUPS[o])[0]);
   it.forEach(x=>{mk(m,'Hvilken modell eller inndeling hører «'+x+'» til?',g,others(g).slice(0,3),why);
    mk(m,'Hvilket av disse hører til '+g+'?',x,out(),why)});
   if(it.length>=3)mk(m,'Hvilket av disse hører IKKE til '+g+'?',out()[0],shuffle(it).slice(0,3),why)})});
 return shuffle(pool)}

 const ta=$('ans-'+V.cur);ta.addEventListener('input',()=>{V.ans[t.id]=ta.value;S.drafts[t.id]=ta.value;save();bossLive()});
 bossLive()}
function bossLive(){const sc=V.chosen.map(id=>scoreAnswer(TASKS.find(x=>x.id===id),V.ans[id]));const avg=Math.round(sc.reduce((s,x)=>s+x.score,0)/3),hp=100-avg;
 $('hp').style.width=hp+'%';$('hptxt').textContent=hp+' % liv igjen';$('wc').textContent=sc[V.cur].w+' ord i denne oppgaven'}
function bossSubmit(){const res=V.chosen.map(id=>{const t=TASKS.find(x=>x.id===id);return{t,text:V.ans[id]||'',...scoreAnswer(t,V.ans[id])}});
 const score=Math.round(res.reduce((s,r)=>s+r.score,0)/3),g=grade(score),secs=Math.floor((Date.now()-V.start)/1000);
 addXp(score*5);if(!S.boss||score>S.boss.score)S.boss={score,grade:g};V.chosen.forEach(id=>delete S.drafts[id]);save();
 go({name:'boss',stage:'result',res,score,g,secs})}
function bResult(){const won=V.score>=60;
 app.innerHTML=`<section class="card"><span class="eyebrow">Sensuren har falt</span><div class="row"><span class="grade">${V.g}</span><div><h1>${won?'Sensor er beseiret':'Sensor står fortsatt'}</h1><p class="small">${V.score} av 100 poeng · +${V.score*5} XP</p></div></div>
 <p class="note">Karakteren bygger på en automatisk sjekk av nøkkelpunkter. Bruk listene under til å se hva du glemte, og sammenlign drøftingen din med mønsterbesvarelsen.</p>
 <div class="row"><button class="btn" data-act="bossdraw">Ny bossfight</button><button class="btn ghost" data-act="home">Til forsiden</button></div></section>
 ${V.res.map((r,i)=>`<section class="card"><div class="qmeta"><span class="pill">Oppgave ${i+1} · ${esc(r.t.src)}</span><span>${r.w} ord</span></div>
 <div class="row"><span class="grade" style="font-size:2.2rem">${grade(r.score)}</span><h2>${esc(r.t.title)} · ${r.score} poeng</h2></div>
 <h3>Faglige nøkkelpunkter</h3><ul class="check">${r.crit.map(c=>`<li><span class="${c.ok?'y':'n'}">${c.ok?'✓':'✗'}</span><span>${esc(c.l)}</span></li>`).join('')}</ul>
 ${r.w<r.L[0]?'<p class="small">Svaret er under '+r.L[0]+' ord, så de faglige punktene teller redusert.</p>':''}
 <h3>Sensorkriterier for A</h3><ul class="check">${r.gen.map(c=>`<li><span class="${c.ok?'y':'n'}">${c.ok?'✓':c.v>0?'~':'✗'}</span><span>${esc(c.l)}</span></li>`).join('')}</ul>
 <details><summary>Mønsterbesvarelse</summary><div class="model"><ul>${r.t.m.map(x=>'<li>'+x+'</li>').join('')}</ul></div></details>
 ${r.text.trim()?`<details><summary>Ditt svar</summary><p style="white-space:pre-wrap">${esc(r.text)}</p></details>`:''}</section>`).join('')}`}

/* ---------- Lær ---------- */
function startLearn(id){const m=M.find(x=>x.id===id),pages=[null];for(let i=0;i<m.terms.length;i+=4)pages.push(m.terms.slice(i,i+4));go({name:'learn',m,pages,p:0})}
function vLearn(){const m=V.m,last=V.p===V.pages.length-1;
 app.innerHTML=`<button class="back" data-act="quizhub">← Til nøkkeltavlen</button>
 <div class="qmeta"><span>Leksjon · Rom ${m.nr}</span><span>Side ${V.p+1} av ${V.pages.length}</span></div>
 <div class="prog"><span style="width:${(V.p+1)/V.pages.length*100}%"></span></div>
 <section class="hero"><h1>${esc(m.name)}</h1><p class="small">Pensum: ${esc(m.pensum)}</p></section>
 ${V.p===0?`<section class="card"><h3>Huskeregler</h3><ul class="husk">${HUSK[m.id].map(h=>'<li>'+esc(h)+'</li>').join('')}</ul></section>
 <section class="card book">${BOOK[m.id].map(s=>`<h4>${s[0]}</h4>${s[1]}`).join('')}</section>`
 :`<section class="card"><h3>Begreper du må kunne</h3>${V.pages[V.p].map(t=>`<div class="lcard"><b>${esc(t[0])}</b>${esc(t[1])}</div>`).join('')}</section>`}
 <div class="row">${V.p>0?'<button class="btn ghost" data-act="lprev">Forrige</button>':''}${last?`<button class="btn" data-act="ldone">Test deg selv i quizen</button><button class="btn ghost" data-act="flash" data-id="${m.id}">Øv med begrepskort</button>`:'<button class="btn" data-act="lnext">Neste side</button>'}</div>`}

/* ---------- Fagbok ---------- */
function bookMods(q){q=(q||'').trim().toLowerCase();
 const out=M.map(m=>{const secs=BOOK[m.id].filter(s=>!q||(m.name+' '+s[0]+' '+s[1]).toLowerCase().includes(q)),terms=m.terms.filter(t=>!q||(m.name+' '+t[0]+' '+t[1]).toLowerCase().includes(q));
  if(!secs.length&&!terms.length)return'';
  return`<details class="mod" ${q?'open':''}><summary>Rom ${m.nr} · ${esc(m.name)}</summary><div class="book"><p class="small">Pensum: ${esc(m.pensum)}</p>
  ${q?'':`<h4>Huskeregler</h4><ul>${HUSK[m.id].map(h=>'<li>'+esc(h)+'</li>').join('')}</ul>`}
  ${secs.map(s=>`<h4>${s[0]}</h4>${s[1]}`).join('')}
  ${terms.length?`<h4>Begreper</h4>${terms.map(t=>`<div class="lcard"><b>${esc(t[0])}</b>${esc(t[1])}</div>`).join('')}`:''}
  <div class="row" style="margin-top:12px"><button class="btn sm" data-act="quiz" data-id="${m.id}">Test deg i denne modulen</button></div></div></details>`}).join('');
 return out||'<p class="small">Ingen treff. Prøv et annet ord, for eksempel «Kotter» eller «omdømme».</p>'}
function vBook(){
 app.innerHTML=`<button class="back" data-act="home">← Til forsiden</button>
 <section class="hero"><span class="eyebrow">Hele pensum</span><h1>Fagboka</h1><p class="lead">Alt fra kompendiet, modul for modul. Trykk på en modul for å åpne den, eller søk etter et begrep eller en modell.</p>
 <label class="small" for="bq">Søk i fagboka</label><input type="search" id="bq" placeholder="For eksempel Iceberg, salience eller grønnvasking" autocomplete="off"></section>
 <section class="grid" id="bres">${bookMods('')}</section>`;
 $('bq').addEventListener('input',e=>{$('bres').innerHTML=bookMods(e.target.value)})}

/* ---------- Minispill ---------- */
function vGameHub(){
 app.innerHTML=`<button class="back" data-act="home">← Til forsiden</button>
 <section class="hero"><span class="eyebrow">Modus 4</span><h1>Minispill</h1><p class="lead">To rolige spill uten klokke. Ta den tiden du trenger, og lær begrepene mens du jakter rekord.</p></section>
 <section class="grid g2">
 <article class="card"><span class="pill">12 par</span><h2>Begrepspar</h2><p class="small">Koble begrep og forklaring. Tre riktige på rad øker poengene, og feil kobling koster fem poeng.</p>
 <div class="row"><span class="big">${S.hi.match||0}</span><span class="small">rekord</span></div><div class="row"><button class="btn" data-act="match">Start Begrepspar</button></div></article>
 <article class="card"><span class="pill">Tre liv</span><h2>Modellsortering</h2><p class="small">Et begrep dukker opp. Velg modellen det hører til. Bommer du, ser du hvilke begreper som hører sammen.</p>
 <div class="row"><span class="big">${S.hi.sort||0}</span><span class="small">rekord</span></div><div class="row"><button class="btn" data-act="sort">Start Modellsortering</button></div></article>
 </section>`}
function gameHead(title,right){return`<button class="back" data-act="gamehub">← Avslutt spillet</button>
 <div class="qmeta"><span>${title}</span><span>${right}</span></div>`}
function deal(){if(V.deck.length<4)V.deck=shuffle(allTerms());const four=V.deck.splice(0,4);V.L=four.slice();V.R=shuffle(four);V.goneL=[];V.goneR=[];V.sl=null;V.sr=null}
function startMatch(){go({name:'match',deck:shuffle(allTerms()),L:[],R:[],goneL:[],goneR:[],score:0,combo:0,pairs:0});deal();render()}
function vMatch(){
 app.innerHTML=gameHead('Begrepspar',`<span class="big">${V.score}</span> poeng · par ${Math.min(V.pairs+1,12)} av 12${V.combo>=3?' · '+V.combo+' på rad':''}`)+
 `<div class="prog"><span style="width:${V.pairs/12*100}%"></span></div>
 <section class="mboard"><div class="mcol mterms">${V.L.map((x,i)=>`<button class="opt ${V.goneL.includes(i)?'gone':''} ${V.sl===i?'sel':''} ${V.bad&&V.bad[0]===i?'wrong':''}" data-act="ml" data-i="${i}"><span>${esc(x.t)}</span></button>`).join('')}</div>
 <div class="mcol">${V.R.map((x,i)=>`<button class="opt ${V.goneR.includes(i)?'gone':''} ${V.sr===i?'sel':''} ${V.bad&&V.bad[1]===i?'wrong':''}" data-act="mr" data-i="${i}"><span>${esc(x.d)}</span></button>`).join('')}</div></section>
 <p class="small">Trykk på et begrep og deretter på forklaringen som hører til.</p>`}
function matchSel(side,i){V.bad=null;V[side]=V[side]===i?null:i;
 if(V.sl!=null&&V.sr!=null){if(V.L[V.sl].t===V.R[V.sr].t){V.combo++;V.pairs++;V.score+=10*(1+Math.floor(V.combo/3));V.goneL.push(V.sl);V.goneR.push(V.sr);V.sl=V.sr=null;
   if(V.pairs>=12){gameEnd();return}if(V.goneL.length===4)deal()}
  else{V.combo=0;V.score=Math.max(0,V.score-5);V.bad=[V.sl,V.sr];V.sl=V.sr=null}}
 render()}
function sortNext(){const GK=Object.keys(GROUPS),g=GK[Math.floor(Math.random()*GK.length)],it=GROUPS[g][Math.floor(Math.random()*GROUPS[g].length)];
 V.cur={g,it,opts:shuffle([g,...shuffle(GK.filter(x=>x!==g)).slice(0,3)])};V.fb=null;render()}
function startSort(){go({name:'sort',lives:3,score:0,streak:0,n:0,cur:{g:'',it:'',opts:[]},fb:null});sortNext()}
function vSort(){const c=V.cur,f=V.fb;
 app.innerHTML=gameHead('Modellsortering',`<span class="big">${V.score}</span> poeng · <span class="lives" aria-label="${V.lives} liv igjen">${'♥'.repeat(V.lives)}</span>${V.streak>=3?' · '+V.streak+' på rad':''}`)+
 `<section class="card"><span class="eyebrow">Hvilken modell hører dette til?</span><div class="item">${esc(c.it)}</div>
 <div class="opts">${c.opts.map((o,i)=>`<button class="opt ${f?(o===c.g?'right':i===f.i?'wrong':''):''}" data-act="spick" data-i="${i}" ${f?'disabled':''}><span>${esc(o)}</span></button>`).join('')}</div>
 ${f?`<div class="fb no"><b class="no">Feil.</b> «${esc(c.it)}» hører til ${esc(c.g)}, sammen med ${esc(GROUPS[c.g].filter(x=>x!==c.it).join(', '))}.</div>
 ${expBox([GMOD[c.g]],c.g+' '+c.it)}
 <div class="row"><button class="btn" data-act="snext" id="nextbtn">${V.lives>0?'Fortsett':'Se resultat'}</button></div>`:''}</section>`;
 if(f)$('nextbtn').focus()}
function sortPick(i){if(V.fb)return;const c=V.cur;
 if(c.opts[i]===c.g){V.streak++;V.n++;V.score+=10+Math.min(V.streak,10)*2;sortNext()}
 else{V.lives--;V.streak=0;V.fb={i};render()}}
function gameEnd(){const g=V.name,score=V.score,old=S.hi[g]||0,xp=Math.round(score/4);if(score>old){S.hi[g]=score;save()}addXp(xp);
 go({name:'gameend',g,score,old,xp,info:g==='match'?V.pairs+' riktige koblinger':V.n+' riktige svar'})}
function vGameEnd(){const rec=V.score>V.old;
 app.innerHTML=`<section class="card"><span class="eyebrow">${V.g==='match'?'Begrepspar':'Modellsortering'}</span><div class="row"><span class="grade">${V.score}</span><div><h1>${rec?'Ny rekord':'Runden er over'}</h1><p class="small">${V.info} · ${rec?'forrige rekord '+V.old:'rekord '+V.old} · +${V.xp} XP</p></div></div>
 <div class="row"><button class="btn" data-act="${V.g}">Spill igjen</button><button class="btn ghost" data-act="gamehub">Bytt spill</button><button class="btn ghost" data-act="home">Til forsiden</button></div></section>`}

/* ---------- Hendelser ---------- */
const A={
 home:()=>go({name:'home'}),quizhub:()=>go({name:'quizhub'}),casehub:()=>go({name:'casehub'}),
 quiz:d=>startQuiz(d.id),pick:d=>pick(+d.i),next:nextQ,
 hint:()=>{const q=V.round[V.i];V.hint=shuffle(q.opts.map((_,i)=>i).filter(i=>i!==q.c)).slice(0,2);render()},
 learn:d=>startLearn(d.id),lnext:()=>{V.p++;render();window.scrollTo(0,0)},lprev:()=>{V.p--;render();window.scrollTo(0,0)},
 ldone:()=>{addXp(10);startQuiz(V.m.id)},
 gamehub:()=>go({name:'gamehub'}),book:()=>go({name:'book'}),match:startMatch,sort:startSort,
 ml:d=>matchSel('sl',+d.i),mr:d=>matchSel('sr',+d.i),spick:d=>sortPick(+d.i),
 snext:()=>{if(V.lives>0)sortNext();else gameEnd()},
 flash:d=>startFlash(d.id),fopen:()=>{V.open=true;render()},
 fknow:()=>{V.queue.shift();V.known++;V.open=false;addXp(2);render()},
 fagain:()=>{V.queue.push(V.queue.shift());V.open=false;render()},
 case:d=>startCase(d.id),cpick:d=>cpick(+d.i),cnext,
 bossintro:bossIntro,bossdraw:bossDraw,
 bosstoggle:d=>{const i=V.chosen.indexOf(d.id);if(i>=0)V.chosen.splice(i,1);else if(V.chosen.length<3)V.chosen.push(d.id);else toast('Du kan bare velge tre oppgaver');render()},
 bossstart:()=>{const ans={};V.chosen.forEach(id=>ans[id]=S.drafts[id]||'');go({name:'boss',stage:'write',chosen:V.chosen,cur:0,ans,start:Date.now()})},
 bosstab:d=>{V.cur=+d.i;render()},
 bosssubmit:()=>{const empty=V.chosen.filter(id=>!(V.ans[id]||'').trim()).length;
  if(empty&&!V.sure){V.sure=true;$('confirm').innerHTML=`<div class="fb no"><b class="no">${empty} av 3 oppgaver er tomme.</b> Trykk «Lever alle tre» én gang til for å levere likevel.</div>`;return}bossSubmit()},
 bossquit:()=>go({name:'boss',stage:'intro'}),
 reset:()=>{if(!V.sureReset){V.sureReset=true;toast('Trykk én gang til for å slette all fremgang');return}S={xp:0,quiz:{},cases:{},boss:null,drafts:{},hi:{}};save();renderTop();go({name:'home'});toast('Fremgangen er nullstilt')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&A[b.dataset.act])A[b.dataset.act](b.dataset)});
document.addEventListener('keydown',e=>{if(V.name!=='quiz'||e.target.tagName==='TEXTAREA')return;
 if(V.picked==null&&/^[1-4]$/.test(e.key))pick(+e.key-1)});
renderTop();render();
</script>
</body>
